name: Valider les données

on:
  push:
    paths:
      - "data/**"
      - "assets/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "assets/**"
      - "scripts/**"

jobs:
  valider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/valider.js
