name: Valider les données

on:
  push:
    paths:
      - "data/**"
      - "assets/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "assets/**"
      - "scripts/**"

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/valider.js
